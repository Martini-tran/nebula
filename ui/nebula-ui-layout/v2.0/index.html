<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nebula Admin v2.0 — 混合导航设计稿</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="layout.css">
</head>
<body>

<div class="app">

  <!-- ==================== 顶栏：一级导航（大类） ==================== -->
  <header class="topnav">
    <div class="topnav__logo">
      <div class="topnav__logo-mark">N</div>
      <div class="topnav__logo-text">Nebula</div>
    </div>

    <nav class="topnav__list" id="topnav"><!-- JS 渲染 --></nav>

    <div class="topnav__spacer"></div>

    <div class="topnav__search">
      <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span>搜索</span><span class="topnav__kbd">Ctrl K</span>
    </div>
    <button class="topnav__icon-btn" title="刷新">
      <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button class="topnav__icon-btn" title="通知">
      <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    </button>
    <button class="topnav__icon-btn" title="全屏">
      <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <div class="topnav__avatar">A</div>
  </header>

  <!-- ==================== 下半：侧栏 + 内容 ==================== -->
  <div class="app__body">

    <!-- ---------- 侧栏：当前大类的子菜单 ---------- -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__section">
        <div class="sidebar__section-title" id="secTitle"></div>
      </div>
      <nav class="sidebar__scroll" id="submenu"><!-- JS 渲染 --></nav>
      <div class="sidebar__footer">
        <button class="sidebar__collapse-btn" onclick="collapse()">
          <svg class="menu__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>
          <span class="menu__text">收起菜单</span>
        </button>
      </div>
    </aside>

    <!-- ---------- 主区 ---------- -->
    <div class="app__main">

      <header class="header">
        <div class="header__breadcrumb" id="crumb"></div>
        <div class="header__spacer"></div>
      </header>

      <div class="tabbar">
        <div class="tab"><span class="tab__dot"></span>工作台</div>
        <div class="tab">文章管理<span class="tab__close">×</span></div>
        <div class="tab tab--active" id="activeTab">标签管理<span class="tab__close">×</span></div>
      </div>

      <main class="content">

        <div class="stat-bar">
          <div class="stat"><div class="stat__label">标签总数</div><div class="stat__value">128</div><div class="stat__delta stat__delta--up">↑ 12 本月新增</div></div>
          <div class="stat"><div class="stat__label">已关联文章</div><div class="stat__value">1,024</div><div class="stat__delta stat__delta--up">↑ 8.2% 环比</div></div>
          <div class="stat"><div class="stat__label">未使用标签</div><div class="stat__value">17</div><div class="stat__delta stat__delta--down">↓ 建议清理</div></div>
          <div class="stat"><div class="stat__label">本月引用</div><div class="stat__value">3,891</div><div class="stat__delta stat__delta--up">↑ 15.4% 环比</div></div>
        </div>

          <div class="searchbar">
            <div class="field"><label class="field__label">标签名称</label><input class="input" placeholder="请输入标签名称"></div>
            <div class="field"><label class="field__label">Slug</label><input class="input" placeholder="请输入 Slug"></div>
            <div class="field"><label class="field__label">状态</label><select class="select"><option>全部</option><option>启用</option><option>停用</option></select></div>
            <button class="btn btn--primary"><svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>查询</button>
            <button class="btn">重置</button>
          </div>

          <div class="toolbar">
            <span class="toolbar__title">标签列表</span>
            <span class="toolbar__count">128 条</span>
            <div class="toolbar__spacer"></div>
            <button class="btn btn--primary btn--sm"><svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>新增标签</button>
            <button class="btn btn--sm">导出</button>
            <button class="btn btn--ghost btn--sm" title="刷新"><svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead><tr>
                <th class="table__check"><input type="checkbox" class="checkbox"></th>
                <th style="width:60px">#</th>
                <th style="min-width:200px">标签名称</th>
                <th style="min-width:160px">Slug</th>
                <th class="col-center" style="width:110px">使用次数</th>
                <th style="width:100px">状态</th>
                <th style="width:170px">创建时间</th>
                <th style="width:150px">操作</th>
              </tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>

          <div class="pager">
            <span class="pager__info">共 128 条 · 每页 10 条</span>
            <div class="pager__spacer"></div>
            <div class="pager__list">
              <button class="pager__btn" disabled>‹</button>
              <button class="pager__btn pager__btn--active">1</button>
              <button class="pager__btn">2</button>
              <button class="pager__btn">3</button>
              <button class="pager__btn">…</button>
              <button class="pager__btn">13</button>
              <button class="pager__btn">›</button>
            </div>
          </div>
      </main>
    </div>
  </div>
</div>

<div class="v-badge">v2.0 · 顶部大类 + 侧边子菜单</div>

<script>
/* ==========================================================================
   菜单数据 —— 与后端 /system/menu/all 下发结构一致：
   一级 = 顶部大类，children = 侧边子菜单（支持二级分组）
   ========================================================================== */
const I = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  blog:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  bot:'<rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><path d="M8 16h.01M16 16h.01"/>',
  flow:'<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M6 9v6a3 3 0 0 0 3 3h6"/>',
  relay:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/>',
  space:'<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  sys:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>'
};

const MENU = [
  { key:'dash', title:'工作台', icon:I.dash, children:[
    { title:'分析页' }, { title:'工作台' }
  ]},
  { key:'blog', title:'博客', icon:I.blog, badge:3, children:[
    { group:'内容' },
    { title:'文章管理' }, { title:'随笔管理' }, { title:'标签管理', active:true },
    { title:'分类管理' }, { title:'系列管理' },
    { group:'任务' },
    { title:'导入任务', badge:3 }
  ]},
  { key:'ai', title:'AI 能力', icon:I.bot, children:[
    { group:'智能体' },
    { title:'智能体定义' }, { title:'智能体实例' }, { title:'实例回放' }, { title:'迭代链(系列)' },
    { group:'编排' },
    { title:'流程列表' }, { title:'AI对话' },
    { group:'模型资产' },
    { title:'知识库' }, { title:'MCP服务器' }, { title:'模型档案' },
    { title:'提示词' }, { title:'AI工具' }
  ]},
  { key:'relay', title:'AI中转', icon:I.relay, children:[
    { title:'服务商管理' }, { title:'套餐管理' }, { title:'套餐类型' },
    { title:'AI模型' }, { title:'支付方式' }, { title:'推荐与测评' }, { title:'充值记录' }
  ]},
  { key:'space', title:'个人空间', icon:I.space, children:[
    { title:'书签管理' }, { title:'目录管理' }, { title:'标签管理' },
    { title:'导入任务' }, { title:'导出任务' }
  ]},
  { key:'sys', title:'系统', icon:I.sys, children:[
    { title:'用户管理' }, { title:'文件管理' }, { title:'菜单管理' }
  ]}
];

const ROWS = [
  ['Vue','vue',126,'success','启用','2026-08-12 09:31'],
  ['TypeScript','typescript',98,'success','启用','2026-08-11 16:02'],
  ['Spring Boot','spring-boot',87,'success','启用','2026-08-10 11:45'],
  ['向量检索','vector-search',43,'warning','草稿','2026-08-09 20:18'],
  ['Milvus','milvus',31,'success','启用','2026-08-08 14:27'],
  ['状态机','state-machine',24,'muted','停用','2026-08-07 10:03'],
  ['DAG 编排','dag',19,'success','启用','2026-08-06 08:52'],
  ['长期记忆','long-term-memory',12,'danger','异常','2026-08-05 19:40']
];

let current = 'blog';           // 当前大类
let activeSub = '标签管理';      // 当前子菜单

const svg = (p, cls) => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor">${p}</svg>`;

function renderTop() {
  document.getElementById('topnav').innerHTML = MENU.map(m => `
    <div class="topnav__item ${m.key===current?'topnav__item--active':''}" onclick="pick('${m.key}')">
      ${svg(m.icon,'topnav__icon')}<span>${m.title}</span>
      ${m.badge?`<span class="topnav__badge">${m.badge}</span>`:''}
    </div>`).join('');
}

function renderSide() {
  const m = MENU.find(x => x.key === current);
  document.getElementById('secTitle').textContent = m.title;

  document.getElementById('submenu').innerHTML = m.children.map(c => {
    if (c.group) return `<div class="menu__group-title">${c.group}</div>`;
    const on = c.title === activeSub;
    return `<a class="menu__item ${on?'menu__item--active':''}" data-title="${c.title}" onclick="pickSub('${c.title}')">
      <span class="menu__text">${c.title}</span>
      ${c.badge?`<span class="menu__badge">${c.badge}</span>`:''}
    </a>`;
  }).join('');

  document.getElementById('crumb').innerHTML =
    `<span>${m.title}</span><span class="header__sep">/</span><b>${activeSub}</b>`;
  document.getElementById('activeTab').innerHTML =
    `${activeSub}<span class="tab__close">×</span>`;
}

function pick(k) {
  current = k;
  const m = MENU.find(x => x.key === k);
  // 切大类时，默认选中该类第一个可点子项
  const first = m.children.find(c => !c.group);
  activeSub = first ? first.title : '';
  renderTop(); renderSide();
}

function pickSub(t) { activeSub = t; renderSide(); }

function collapse() {
  document.getElementById('sidebar').classList.toggle('sidebar--collapsed');
}

function renderRows() {
  document.getElementById('tbody').innerHTML = ROWS.map((r,i) => `
    <tr>
      <td><input type="checkbox" class="checkbox"></td>
      <td class="table__seq">${i+1}</td>
      <td class="table__name">${r[0]}</td>
      <td><span class="table__code">${r[1]}</span></td>
      <td class="col-center table__num">${r[2]}</td>
      <td><span class="tag tag--${r[3]}"><span class="tag__dot"></span>${r[4]}</span></td>
      <td class="table__time">${r[5]}</td>
      <td><div class="table__actions">
        <button class="link-btn">编辑</button>
        <button class="link-btn link-btn--danger">删除</button>
      </div></td>
    </tr>`).join('');
}

renderTop(); renderSide(); renderRows();
</script>

</body>
</html>
