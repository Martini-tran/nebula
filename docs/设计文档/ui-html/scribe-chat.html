<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scribe 创作对话 · 原型</title>
<!--
  创作对话页（全屏）交互原型，对应《写作Agent设计.md》7.6。
  纯静态单文件：配色取自 ui/nebula-scribe/src/styles/theme.scss 的三套主题，回复为本地演示数据。
  可验证：新建/切换/搜索/重命名/删除会话、关联作品（首条消息后锁定）、流式输出与停止、
  失败与重试（问题里带「失败」二字触发）、重新生成、复制、主题切换、窄屏抽屉。
-->
<style>
:root[data-theme='light'] {
  --bg-canvas: #f7f4ee; --bg-surface: #fffdf8; --bg-soft: #f0ebe1;
  --text: #1f1b16; --text-2: #6b6259; --border: #e3dbcd;
  --brand: #b45309; --brand-hover: #92400e; --brand-soft: #fdf0dd; --on-brand: #fffdf8;
  --accent: #0f766e; --accent-soft: #dcf5f1; --danger: #dc2626; --danger-soft: #fdecec;
  --shadow: 0 30px 70px rgba(31, 27, 22, 0.18);
}
:root[data-theme='dark'] {
  --bg-canvas: #14110e; --bg-surface: #1e1a16; --bg-soft: #272119;
  --text: #f2ece1; --text-2: #b3a798; --border: #3a3129;
  --brand: #f0a45c; --brand-hover: #f7be86; --brand-soft: rgba(240, 164, 92, 0.16); --on-brand: #14110e;
  --accent: #5eead4; --accent-soft: rgba(94, 234, 212, 0.14); --danger: #f87171; --danger-soft: rgba(248, 113, 113, 0.14);
  --shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
}
:root[data-theme='paper'] {
  --bg-canvas: #efe6d4; --bg-surface: #f8f1e2; --bg-soft: #e6dbc4;
  --text: #34291a; --text-2: #7a6a51; --border: #d9cbaf;
  --brand: #9a6224; --brand-hover: #7c4d19; --brand-soft: #f2e3c9; --on-brand: #f8f1e2;
  --accent: #4d7c3f; --accent-soft: #e4eddc; --danger: #b42318; --danger-soft: #f6e0d8;
  --shadow: 0 30px 70px rgba(52, 41, 26, 0.2);
}
:root { --radius: 0.5rem; --sidebar: 16rem; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  background: var(--bg-canvas); color: var(--text); font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }
input, textarea, select { font: inherit; color: inherit; }
svg { width: 1.1rem; height: 1.1rem; flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.app { display: flex; height: 100vh; overflow: hidden; }

/* ── 左栏 ── */
.side {
  width: var(--sidebar); flex-shrink: 0; display: flex; flex-direction: column;
  background: var(--bg-soft); border-right: 1px solid var(--border);
  transition: margin-left .22s ease;
}
.app.collapsed .side { margin-left: calc(-1 * var(--sidebar)); }
.side__top { display: flex; align-items: center; justify-content: space-between; padding: .8rem .8rem .4rem; }
.brand { display: inline-flex; align-items: center; gap: .4rem; border: 0; background: none; padding: .3rem .4rem; border-radius: var(--radius); font-weight: 800; }
.brand:hover { background: var(--bg-surface); }
.icon-btn { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border: 0; background: none; border-radius: var(--radius); color: var(--text-2); }
.icon-btn:hover:not(:disabled) { background: var(--bg-surface); color: var(--text); }
.side__actions { display: flex; flex-direction: column; gap: .5rem; padding: .4rem .8rem .6rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .5rem .85rem; border-radius: var(--radius); border: 1px solid transparent; font-weight: 600; font-size: .9rem; }
.btn--primary { background: var(--brand); color: var(--on-brand); }
.btn--primary:hover:not(:disabled) { background: var(--brand-hover); }
.btn--ghost { background: var(--bg-surface); border-color: var(--border); }
.btn--ghost:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
.btn--danger { background: var(--danger); color: #fff; }
.search { position: relative; }
.search svg { position: absolute; left: .6rem; top: 50%; transform: translateY(-50%); color: var(--text-2); width: 1rem; height: 1rem; }
.search input { width: 100%; padding: .45rem .6rem .45rem 2rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-surface); }
.search input:focus { outline: none; border-color: var(--brand); }

.list { flex: 1; overflow-y: auto; padding: .2rem .5rem .8rem; }
.group { margin-top: .7rem; padding: 0 .5rem .3rem; font-size: .75rem; font-weight: 700; color: var(--text-2); }
.conv { position: relative; display: flex; align-items: center; border-radius: var(--radius); }
.conv__main { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: .5rem .55rem; border-radius: var(--radius); }
.conv:hover, .conv.active { background: var(--bg-surface); }
.conv.active { box-shadow: inset 3px 0 0 var(--brand); }
.conv__title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
.conv__work { display: block; margin-top: .1rem; font-size: .75rem; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv__more { opacity: 0; margin-right: .2rem; }
.conv:hover .conv__more, .conv.active .conv__more, .conv__more[aria-expanded="true"] { opacity: 1; }
.menu {
  position: absolute; right: .2rem; top: 2.3rem; z-index: 20; min-width: 7.5rem; padding: .3rem;
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
}
.menu button { display: flex; align-items: center; gap: .5rem; width: 100%; border: 0; background: none; padding: .45rem .6rem; border-radius: .35rem; font-size: .88rem; text-align: left; }
.menu button:hover { background: var(--bg-soft); }
.menu .danger { color: var(--danger); }
.rename { width: 100%; margin: .25rem; padding: .35rem .5rem; border: 1px solid var(--brand); border-radius: .35rem; background: var(--bg-surface); }
.rename:focus { outline: none; }
.side__empty { padding: 1.5rem .8rem; color: var(--text-2); font-size: .85rem; text-align: center; }

.side__foot { display: flex; align-items: center; gap: .4rem; padding: .7rem .8rem; border-top: 1px solid var(--border); }
.user { flex: 1; display: flex; align-items: center; gap: .5rem; min-width: 0; font-weight: 600; font-size: .9rem; }
.avatar { display: grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: .85rem; flex-shrink: 0; }
.themes { display: flex; gap: .15rem; padding: .15rem; border-radius: 999px; background: var(--bg-surface); border: 1px solid var(--border); }
.themes button { width: 1.7rem; height: 1.7rem; border: 0; border-radius: 999px; background: none; display: grid; place-items: center; color: var(--text-2); }
.themes button[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); }
.themes svg { width: .95rem; height: .95rem; }

/* ── 右栏 ── */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-canvas); }
.bar { display: flex; align-items: center; gap: .6rem; min-height: 3.4rem; padding: .5rem 1rem; border-bottom: 1px solid var(--border); background: var(--bg-surface); }
.bar .open-side { display: none; }
.app.collapsed .bar .open-side { display: inline-grid; }
.work-select { display: inline-flex; align-items: center; gap: .35rem; }
.work-select select { padding: .35rem .5rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-canvas); max-width: 12rem; }
.work-tag { display: inline-flex; align-items: center; gap: .3rem; padding: .25rem .6rem; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: .82rem; font-weight: 600; white-space: nowrap; }
.work-tag--none { background: var(--bg-soft); color: var(--text-2); }
.work-tag svg { width: .9rem; height: .9rem; }
.bar__sep { color: var(--text-2); }
.title { flex: 1; min-width: 0; display: flex; align-items: center; gap: .3rem; }
.title h1 { margin: 0; font-size: 1rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title input { flex: 1; font-size: 1rem; font-weight: 700; padding: .25rem .45rem; border: 1px solid var(--brand); border-radius: .35rem; background: var(--bg-canvas); }
.title input:focus { outline: none; }
.hint-lock { font-size: .75rem; color: var(--text-2); white-space: nowrap; }

.scroll { flex: 1; overflow-y: auto; }
.column { max-width: 48rem; margin: 0 auto; padding: 1.5rem 1.25rem 1rem; }

.welcome { padding-top: 8vh; text-align: center; }
.welcome__icon { display: inline-grid; place-items: center; width: 3.2rem; height: 3.2rem; border-radius: 1rem; background: var(--brand-soft); color: var(--brand); }
.welcome__icon svg { width: 1.6rem; height: 1.6rem; }
.welcome h2 { margin: .9rem 0 .4rem; font-size: 1.4rem; }
.welcome p { margin: 0 auto; max-width: 30rem; color: var(--text-2); line-height: 1.7; }
.prompts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; margin-top: 2rem; text-align: left; }
.prompt { border: 1px solid var(--border); background: var(--bg-surface); border-radius: .75rem; padding: .8rem .9rem; }
.prompt:hover { border-color: var(--brand); background: var(--brand-soft); }
.prompt strong { display: block; font-size: .92rem; }
.prompt span { display: block; margin-top: .25rem; font-size: .8rem; color: var(--text-2); }

.msg { display: flex; margin-bottom: 1.4rem; }
.msg--user { justify-content: flex-end; }
.msg--user .bubble { max-width: 80%; background: var(--brand-soft); padding: .65rem .9rem; border-radius: 1rem 1rem .3rem 1rem; white-space: pre-wrap; line-height: 1.7; }
.msg--ai { gap: .7rem; }
.msg--ai .ai-avatar { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); flex-shrink: 0; margin-top: .1rem; }
.msg--ai .ai-avatar svg { width: 1rem; height: 1rem; }
.ai-body { flex: 1; min-width: 0; }
.md { line-height: 1.8; }
.md p { margin: 0 0 .7rem; }
.md ol, .md ul { margin: 0 0 .7rem; padding-left: 1.3rem; }
.md li { margin: .2rem 0; }
.md strong { color: var(--text); }
.cursor { display: inline-block; width: .5rem; height: 1rem; margin-left: 2px; vertical-align: -2px; background: var(--brand); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.thinking { display: inline-flex; gap: .25rem; padding: .6rem 0; }
.thinking i { width: .45rem; height: .45rem; border-radius: 999px; background: var(--text-2); animation: dot 1.2s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.status { display: inline-flex; align-items: center; gap: .3rem; margin-top: .2rem; font-size: .8rem; color: var(--text-2); }
.failed { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; padding: .6rem .8rem; border-radius: var(--radius); background: var(--danger-soft); color: var(--danger); font-size: .9rem; }
.failed .btn { padding: .3rem .7rem; font-size: .82rem; }
.ai-actions { display: flex; gap: .15rem; margin-top: .3rem; }
.ai-actions button { display: inline-flex; align-items: center; gap: .3rem; border: 0; background: none; padding: .25rem .45rem; border-radius: .35rem; font-size: .8rem; color: var(--text-2); }
.ai-actions button:hover { background: var(--bg-soft); color: var(--text); }
.ai-actions svg { width: .9rem; height: .9rem; }

.composer { padding: .5rem 1.25rem 1.1rem; }
.composer__box { max-width: 48rem; margin: 0 auto; display: flex; align-items: flex-end; gap: .5rem; padding: .55rem .55rem .55rem .9rem; border: 1px solid var(--border); border-radius: 1rem; background: var(--bg-surface); box-shadow: 0 6px 20px rgba(0,0,0,.05); }
.composer__box:focus-within { border-color: var(--brand); }
.composer textarea { flex: 1; resize: none; border: 0; background: none; max-height: 12rem; line-height: 1.6; padding: .35rem 0; }
.composer textarea:focus { outline: none; }
.send { width: 2.3rem; height: 2.3rem; border-radius: .7rem; border: 0; display: grid; place-items: center; background: var(--brand); color: var(--on-brand); }
.send--stop { background: var(--text); color: var(--bg-surface); }
.composer__meta { max-width: 48rem; margin: .4rem auto 0; display: flex; justify-content: space-between; font-size: .75rem; color: var(--text-2); padding: 0 .3rem; }

.toast { position: fixed; left: 50%; bottom: 6rem; transform: translateX(-50%); padding: .5rem .9rem; border-radius: 999px; background: var(--text); color: var(--bg-surface); font-size: .85rem; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }

.mask { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 1rem; background: rgba(10, 8, 6, .45); }
.dialog { width: min(22rem, 100%); padding: 1.2rem; border-radius: .75rem; background: var(--bg-surface); box-shadow: var(--shadow); }
.dialog h3 { margin: 0 0 .5rem; font-size: 1.05rem; }
.dialog p { margin: 0 0 1.1rem; color: var(--text-2); font-size: .9rem; line-height: 1.6; }
.dialog footer { display: flex; justify-content: flex-end; gap: .5rem; }
.scrim { display: none; }

/* 窄屏：左栏变抽屉 */
@media (max-width: 768px) {
  .side { position: fixed; inset: 0 auto 0 0; z-index: 30; margin-left: 0; box-shadow: var(--shadow); transform: translateX(-100%); transition: transform .22s ease; }
  .app.drawer-open .side { transform: none; }
  .app.drawer-open .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(10,8,6,.35); }
  .bar .open-side { display: inline-grid !important; }
  .side .collapse-btn { display: none; }
  .prompts { grid-template-columns: minmax(0, 1fr); }
  .hint-lock { display: none; }
  .msg--user .bubble { max-width: 90%; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="会话列表">
    <div class="side__top">
      <button class="brand" type="button" title="回到 Scribe 首页" onclick="toast('原型：此处返回 Scribe 首页')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Scribe
      </button>
      <button class="icon-btn collapse-btn" type="button" title="收起侧栏" aria-label="收起侧栏" onclick="toggleSide()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>
    </div>
    <div class="side__actions">
      <button class="btn btn--primary" type="button" onclick="newChat()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新对话
      </button>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="搜索对话" aria-label="搜索对话" oninput="renderList()" />
      </label>
    </div>
    <nav class="list" id="list"></nav>
    <div class="side__foot">
      <div class="user"><span class="avatar">沈</span><span>沈砚</span></div>
      <div class="themes" role="group" aria-label="主题">
        <button type="button" data-theme-btn="light" title="浅色" onclick="setTheme('light')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button type="button" data-theme-btn="dark" title="深色" onclick="setTheme('dark')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button type="button" data-theme-btn="paper" title="纸张" onclick="setTheme('paper')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="scrim" onclick="closeDrawer()"></div>

  <main class="main">
    <header class="bar">
      <button class="icon-btn open-side" type="button" aria-label="展开会话列表" title="展开会话列表" onclick="openSide()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div id="work"></div>
      <span class="bar__sep">·</span>
      <div class="title" id="title"></div>
    </header>

    <div class="scroll" id="scroll"><div class="column" id="column"></div></div>

    <footer class="composer">
      <div class="composer__box">
        <textarea id="input" rows="1" maxlength="2000" placeholder="继续问……" aria-label="输入问题"
          oninput="autoGrow(); updateMeta()" onkeydown="onKey(event)"></textarea>
        <button class="send" id="send" type="button" aria-label="发送" onclick="onSendClick()"></button>
      </div>
      <div class="composer__meta"><span>Enter 发送 · Shift + Enter 换行 · 问题里带「失败」可演示失败态</span><span id="count">0 / 2000</span></div>
    </footer>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<div id="modal"></div>

<script>
const WORKS = [{ id: 1, title: '断刀记' }, { id: 2, title: '漏更司' }];
const ICON = {
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
  adopt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>',
  stopped: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 9h6v6H9z"/></svg>',
};

const DAY = 86400000, now = Date.now();
let seq = 100;
let dialogs = [
  { id: 1, title: '柳三娘为什么要去报官', workId: 1, updated: now - 3600e3, messages: [
    { role: 'user', content: '柳三娘为什么要去报官？她明明说自己那晚不在城里。' },
    { role: 'ai', status: 'DONE', content: '从第二章她的说辞看，有三种可能：\n\n1. **她在保护某个人**——报官是为了抢在别人之前，把案子的方向定下来。\n2. **她本来就在城里**——「不在城里」是谎言，而报官恰好暴露了她知道只有在场者才知道的细节。\n3. **她是被人授意的**——漏更司需要一个「局外人」来启动调查。\n\n结合设定库里「她是当年报官的人」这条硬事实，第 2 种最能制造可被读者察觉的破绽。' },
  ]},
  { id: 2, title: '开头怎么写才抓人', workId: null, updated: now - 5 * 3600e3, messages: [
    { role: 'user', content: '开头怎么写才抓人？' },
    { role: 'ai', status: 'DONE', content: '开篇最要紧的是**一个具体的异常**，而不是世界观介绍。第一段就让主角遇到一件不对劲的小事，章末留一个只有主角注意到的细节。' },
  ]},
  { id: 3, title: '卡文了怎么办', workId: null, updated: now - 3 * DAY, messages: [
    { role: 'user', content: '卡文了，写不下去怎么办' },
    { role: 'ai', status: 'DONE', content: '卡文通常不是没想法，而是**下一场戏的目标不清楚**。试着回答：这一章结束时，主角比开头多知道了什么？' },
  ]},
  { id: 4, title: '更漏规则会不会太复杂', workId: 2, updated: now - 12 * DAY, messages: [
    { role: 'user', content: '更漏规则会不会太复杂，读者记不住？' },
    { role: 'ai', status: 'DONE', content: '规则本身可以复杂，但**读者只需要记住一个数字**。建议把「七」反复用在不同场景里，让它自己变成记忆锚点。' },
  ]},
];
// 当前会话；null 表示「新对话」草稿态：不落库，发出首条消息时才创建
let current = dialogs[0];
let draftWorkId = null;
let streaming = null;
let editingTitle = false;
let renamingId = null;
let menuId = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const workTitle = (id) => WORKS.find((w) => w.id === id)?.title;

/** 极简 Markdown：段落、有序/无序列表、加粗；原型够用即可 */
function md(text) {
  return text.split(/\n{2,}/).map((block) => {
    const lines = block.split('\n');
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    if (lines.every((l) => /^\d+\.\s/.test(l))) return '<ol>' + lines.map((l) => '<li>' + inline(l.replace(/^\d+\.\s/, '')) + '</li>').join('') + '</ol>';
    if (lines.every((l) => /^-\s/.test(l))) return '<ul>' + lines.map((l) => '<li>' + inline(l.slice(2)) + '</li>').join('') + '</ul>';
    return '<p>' + lines.map(inline).join('<br>') + '</p>';
  }).join('');
}

function groupOf(ts) {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  if (ts >= start.getTime()) return '今天';
  if (ts >= start.getTime() - DAY) return '昨天';
  if (ts >= start.getTime() - 7 * DAY) return '最近 7 天';
  return '更早';
}

function renderList() {
  const kw = $('search').value.trim();
  const rows = dialogs.filter((d) => !kw || d.title.includes(kw)).sort((a, b) => b.updated - a.updated);
  if (!rows.length) {
    $('list').innerHTML = `<p class="side__empty">${kw ? '没有匹配的对话' : '还没有对话'}</p>`;
    return;
  }
  let html = '', last = '';
  for (const d of rows) {
    const g = groupOf(d.updated);
    if (g !== last) { html += `<div class="group">${g}</div>`; last = g; }
    const active = current && current.id === d.id ? ' active' : '';
    if (renamingId === d.id) {
      html += `<div class="conv${active}"><input class="rename" id="rename" value="${esc(d.title)}" maxlength="60"
        onkeydown="if(event.key==='Enter')commitRename(${d.id});if(event.key==='Escape')cancelRename()" onblur="commitRename(${d.id})"></div>`;
      continue;
    }
    html += `<div class="conv${active}">
      <button class="conv__main" type="button" onclick="openDialog(${d.id})">
        <span class="conv__title">${esc(d.title)}</span>
        ${d.workId ? `<span class="conv__work">《${esc(workTitle(d.workId))}》</span>` : ''}
      </button>
      <button class="icon-btn conv__more" type="button" aria-label="更多操作" aria-expanded="${menuId === d.id}" onclick="toggleMenu(event, ${d.id})">${ICON.more}</button>
      ${menuId === d.id ? `<div class="menu" role="menu">
        <button type="button" role="menuitem" onclick="startRename(${d.id})">${ICON.edit}重命名</button>
        <button type="button" role="menuitem" class="danger" onclick="askDelete(${d.id})">${ICON.trash}删除</button>
      </div>` : ''}
    </div>`;
  }
  $('list').innerHTML = html;
  if (renamingId) { const el = $('rename'); el.focus(); el.select(); }
}

function renderBar() {
  const locked = current && current.messages.length > 0;
  const workId = current ? current.workId : draftWorkId;
  if (locked) {
    $('work').innerHTML = workId
      ? `<span class="work-tag" title="关联作品在首条消息后锁定">${ICON.book}《${esc(workTitle(workId))}》${ICON.lock}</span>`
      : `<span class="work-tag work-tag--none" title="首条消息后不能再关联作品">不关联作品 ${ICON.lock}</span>`;
  } else {
    $('work').innerHTML = `<label class="work-select">${ICON.book}
      <select aria-label="关联作品" onchange="pickWork(this.value)">
        <option value="">不关联作品</option>
        ${WORKS.map((w) => `<option value="${w.id}" ${w.id === workId ? 'selected' : ''}>《${esc(w.title)}》</option>`).join('')}
      </select></label>`;
  }
  const title = current ? current.title : '新对话';
  if (editingTitle && current) {
    $('title').innerHTML = `<input id="titleInput" value="${esc(title)}" maxlength="60" aria-label="对话标题"
      onkeydown="if(event.key==='Enter')saveTitle();if(event.key==='Escape')stopTitle()" onblur="saveTitle()">`;
    $('titleInput').focus(); $('titleInput').select();
  } else {
    $('title').innerHTML = `<h1>${esc(title)}</h1>
      ${current ? `<button class="icon-btn" type="button" aria-label="重命名" title="重命名" onclick="editTitle()">${ICON.edit}</button>` : ''}
      ${!locked ? '<span class="hint-lock">发出第一条消息后，关联作品将锁定</span>' : ''}`;
  }
}

function promptsFor(workId) {
  if (workId) {
    const t = workTitle(workId);
    return [
      ['帮我梳理主要人物关系', `基于《${t}》的设定库`],
      ['检查最近三章有没有前后矛盾', '对照锁定的硬事实'],
      ['还有哪些伏笔没有回收', '按埋设章节列出'],
      ['下一章可以怎么推进', '结合当前梗概给出三个方向'],
    ];
  }
  return [
    ['怎么写一个抓人的开头？', '开篇三段该放什么'],
    ['帮我立一个有记忆点的人物', '习惯、欲望与冲突'],
    ['伏笔怎么埋才不突兀？', '埋设与回收的节奏'],
    ['卡文了，写不下去怎么办', '先找到下一场戏的目标'],
  ];
}

function renderMessages() {
  const msgs = current ? current.messages : [];
  if (!msgs.length) {
    const workId = current ? current.workId : draftWorkId;
    $('column').innerHTML = `<section class="welcome">
      <span class="welcome__icon">${ICON.spark}</span>
      <h2>${workId ? `聊聊《${esc(workTitle(workId))}》` : '今天想聊点什么？'}</h2>
      <p>${workId ? '我会结合这本书的设定、编年和台词样本来回答。' : '情节、人物、伏笔、卡文——直接问。关联一本作品后，我能读到它的设定。'}</p>
      <div class="prompts">${promptsFor(workId).map(([q, d]) =>
        `<button class="prompt" type="button" onclick="send(${JSON.stringify(q).replace(/"/g, '&quot;')})"><strong>${esc(q)}</strong><span>${esc(d)}</span></button>`).join('')}</div>
    </section>`;
    return;
  }
  const lastAi = msgs.map((m) => m.role).lastIndexOf('ai');
  $('column').innerHTML = msgs.map((m, i) => {
    if (m.role === 'user') return `<div class="msg msg--user"><div class="bubble">${esc(m.content)}</div></div>`;
    let body;
    if (m.status === 'PENDING') body = '<span class="thinking" aria-label="思考中"><i></i><i></i><i></i></span>';
    else if (m.status === 'FAILED') body = `<div class="failed" role="alert">回复失败：模型服务暂时不可用
      <button class="btn btn--ghost" type="button" onclick="retry()" ${streaming ? 'disabled' : ''}>重试</button></div>`;
    else body = `<div class="md">${md(m.content)}${m.status === 'STREAMING' ? '<span class="cursor"></span>' : ''}</div>
      ${m.status === 'STOPPED' ? `<span class="status">${ICON.stopped}已停止生成</span>` : ''}`;
    const actions = (m.status === 'DONE' || m.status === 'STOPPED') ? `<div class="ai-actions">
        <button type="button" onclick="copyMsg(${i})">${ICON.copy}复制</button>
        ${i === lastAi ? `<button type="button" onclick="regenerate()" ${streaming ? 'disabled' : ''}>${ICON.redo}重新生成</button>` : ''}
        ${current.workId ? `<button type="button" onclick="toast('批次 C5：采纳后选择落点章节，并记录到 adopted_ref')">${ICON.adopt}采纳</button>` : ''}
      </div>` : '';
    return `<div class="msg msg--ai"><span class="ai-avatar">${ICON.spark}</span><div class="ai-body">${body}${actions}</div></div>`;
  }).join('');
}

function renderSend() {
  const btn = $('send');
  if (streaming) { btn.className = 'send send--stop'; btn.innerHTML = ICON.stop; btn.setAttribute('aria-label', '停止生成'); btn.disabled = false; }
  else { btn.className = 'send'; btn.innerHTML = ICON.send; btn.setAttribute('aria-label', '发送'); btn.disabled = !$('input').value.trim(); }
}

function render() { renderList(); renderBar(); renderMessages(); renderSend(); }
function scrollBottom() { const s = $('scroll'); s.scrollTop = s.scrollHeight; }

function openDialog(id) {
  if (streaming) { toast('正在生成，先停止或等待完成'); return; }
  current = dialogs.find((d) => d.id === id);
  menuId = null; editingTitle = false; closeDrawer();
  render(); scrollBottom();
}
function newChat() {
  if (streaming) { toast('正在生成，先停止或等待完成'); return; }
  current = null; draftWorkId = null; menuId = null; editingTitle = false; closeDrawer();
  render(); $('input').focus();
}
function pickWork(v) {
  const id = v ? Number(v) : null;
  if (current) current.workId = id; else draftWorkId = id;
  render();
}

function reply(question) {
  if (question.includes('失败')) return null;
  const t = current.workId ? workTitle(current.workId) : null;
  if (t) return `结合《${t}》目前的设定，我的看法是：\n\n1. **先确认动机**——人物的每个选择都要能回溯到设定里的「核心欲望」。\n2. **再看代价**——这件事会让他失去什么？代价越具体，戏越好看。\n3. **最后留口子**——给后面的章节留一个可回收的细节。\n\n需要的话，我可以把第 2 点展开成三个具体场景。`;
  return `这个问题可以从三个角度拆：\n\n- **情节**：它推动了什么？\n- **人物**：它暴露了谁的什么？\n- **节奏**：它放在这里，读者会不会累？\n\n（原型演示回复。接入后端后按 7.6.5 的 SSE 逐字输出。）`;
}

function send(text) {
  const q = (text ?? $('input').value).trim();
  if (!q || streaming) return;
  if (!current) {
    // 首条消息才落库：此刻创建会话，标题取首问前 20 字，并锁定关联作品
    current = { id: ++seq, title: q.slice(0, 20), workId: draftWorkId, updated: Date.now(), messages: [] };
    dialogs.push(current);
  }
  $('input').value = ''; autoGrow(); updateMeta();
  current.messages.push({ role: 'user', content: q });
  startReply(q);
}

function startReply(q) {
  const msg = { role: 'ai', status: 'PENDING', content: '' };
  current.messages.push(msg);
  current.updated = Date.now();
  const full = reply(q);
  streaming = { msg, timer: null };
  render(); scrollBottom();
  setTimeout(() => {
    if (!streaming || streaming.msg !== msg) return;
    if (full === null) { msg.status = 'FAILED'; streaming = null; render(); scrollBottom(); return; }
    msg.status = 'STREAMING';
    let i = 0;
    streaming.timer = setInterval(() => {
      i = Math.min(full.length, i + 3);
      msg.content = full.slice(0, i);
      if (i >= full.length) { clearInterval(streaming.timer); msg.status = 'DONE'; streaming = null; }
      renderMessages(); renderSend(); scrollBottom();
    }, 30);
  }, 650);
}

function stop() {
  if (!streaming) return;
  clearInterval(streaming.timer);
  const m = streaming.msg;
  streaming = null;
  if (m.status === 'PENDING') { current.messages.pop(); toast('已停止'); } else m.status = 'STOPPED';
  render();
}
function lastQuestion() { return [...current.messages].reverse().find((m) => m.role === 'user')?.content ?? ''; }
function retry() { current.messages.pop(); startReply(lastQuestion().replace('失败', '')); }
function regenerate() { if (streaming) return; current.messages.pop(); startReply(lastQuestion()); }
function copyMsg(i) { navigator.clipboard?.writeText(current.messages[i].content); toast('已复制'); }

function onSendClick() { streaming ? stop() : send(); }
function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
}
function autoGrow() { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 192) + 'px'; }
function updateMeta() { $('count').textContent = `${$('input').value.length} / 2000`; renderSend(); }

function editTitle() { editingTitle = true; renderBar(); }
function stopTitle() { editingTitle = false; renderBar(); }
function saveTitle() {
  if (!editingTitle) return;
  const v = $('titleInput').value.trim();
  if (v) current.title = v;
  editingTitle = false; render();
}

function toggleMenu(e, id) { e.stopPropagation(); menuId = menuId === id ? null : id; renderList(); }
function startRename(id) { menuId = null; renamingId = id; renderList(); }
function cancelRename() { renamingId = null; renderList(); }
function commitRename(id) {
  if (renamingId !== id) return;
  const v = $('rename').value.trim();
  if (v) dialogs.find((d) => d.id === id).title = v;
  renamingId = null; render();
}
function askDelete(id) {
  menuId = null;
  const d = dialogs.find((x) => x.id === id);
  $('modal').innerHTML = `<div class="mask" onclick="if(event.target===this)closeModal()">
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="del-t">
      <h3 id="del-t">删除这段对话？</h3>
      <p>「${esc(d.title)}」及其全部消息将被永久删除，无法恢复。</p>
      <footer><button class="btn btn--ghost" type="button" onclick="closeModal()">取消</button>
      <button class="btn btn--danger" type="button" onclick="doDelete(${id})">删除</button></footer>
    </div></div>`;
  renderList();
}
function doDelete(id) {
  dialogs = dialogs.filter((d) => d.id !== id);
  if (current && current.id === id) { current = null; draftWorkId = null; }
  closeModal(); render(); toast('已删除');
}
function closeModal() { $('modal').innerHTML = ''; }

function toggleSide() { $('app').classList.toggle('collapsed'); }
function openSide() {
  if (window.matchMedia('(max-width: 768px)').matches) $('app').classList.add('drawer-open');
  else $('app').classList.remove('collapsed');
}
function closeDrawer() { $('app').classList.remove('drawer-open'); }

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('[data-theme-btn]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.themeBtn === t));
}

let toastTimer;
function toast(text) {
  const el = $('toast'); el.textContent = text; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

document.addEventListener('click', () => { if (menuId !== null) { menuId = null; renderList(); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); closeDrawer(); } });

setTheme('light');
render();
scrollBottom();
</script>
</body>
</html>
