# Nebula 单进程聚合部署 —— 叠加文件（overlay）
#
# 作用：用一个 nebula-all 容器（同 JVM 内跑 manager/blog/space/forge 四个上下文）
#       替代原来 4 个独立 Java 容器，把 4 份 JVM 基线合并成 1 份。gateway 保持独立。
#
# 用法（与基础文件叠加，后者提供 mysql/redis/minio/meilisearch/gateway）：
#   docker compose --env-file deploy/.env \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.all-in-one.yml \
#     up -d --build mysql redis minio meilisearch minio-init gateway nebula-all
#
#   注意：本模式下【不要】再 up manager/blog/space/forge（它们已被 nebula-all 取代）。
#
# 内存预算（4c4g）：mysql 448 + redis 96 + minio 320 + meili 192 + gateway 320
#   + nebula-all 1408 + 宿主机 ~680 ≈ 3.46G。比 4 个独立 JVM（512+448+320+384=1664，
#   且各含一份 ~200M 基线）更省，且首次即可容纳 space/forge。

name: nebula

services:
  # 覆盖基础文件里的 gateway：把 4 个路由目标主机统一指向聚合容器（端口不变）。
  gateway:
    environment:
      NEBULA_SERVICE_MANAGER_HOST: nebula-all
      NEBULA_SERVICE_MANAGER_PORT: 8081
      NEBULA_SERVICE_BLOG_HOST: nebula-all
      NEBULA_SERVICE_BLOG_PORT: 8082
      NEBULA_SERVICE_SPACE_HOST: nebula-all
      NEBULA_SERVICE_SPACE_PORT: 8083
      NEBULA_SERVICE_FORGE_HOST: nebula-all
      NEBULA_SERVICE_FORGE_PORT: 8884

  # 聚合业务服务：一个 JVM，四个隔离的 Spring 上下文，四个端口。
  nebula-all:
    image: nebula/all:${NEBULA_VERSION:-1.0.3-SNAPSHOT}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: nebula-service-all
    container_name: nebula-all
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 一个 JVM 承载 4 个上下文，堆给足；4 个内嵌 Tomcat 线程池已在 nebula-*.yml 之外按默认，
      # 若线程内存偏高可再在各 nebula-<svc>.yml 里下调 server.tomcat.threads.max。
      JAVA_OPTS: "-Xms384m -Xmx1100m -XX:MaxRAMPercentage=75 -XX:+UseSerialGC"
      # 可选：只启动部分服务，逗号分隔（缺省全部）。例：NEBULA_SERVICES=manager,blog
      NEBULA_SERVICES: ${NEBULA_SERVICES:-manager,blog,space,forge}
      # --- 后端连接（与基础文件 x-java-env 一致，用 compose 服务名而非 127.0.0.1）---
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nebula}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-nebula}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 必须在 .env 中设置}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 必须在 .env 中设置}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY 必须设置}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY 必须设置}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-nebula}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-public}
      MINIO_PUBLIC_DOMAIN: ${MINIO_PUBLIC_DOMAIN:?MINIO_PUBLIC_DOMAIN 必须设置为浏览器可访问的域名}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:?MEILISEARCH_API_KEY 必须设置}
      # --- AI（blog/manager 需要）---
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY 必须设置}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      # --- manager 专属（模型档案加密 / 向量检索）---
      AI_PROFILE_SECRET: ${AI_PROFILE_SECRET:?AI_PROFILE_SECRET 必须设置为强随机值}
      AI_EMBEDDING_ENABLED: ${AI_EMBEDDING_ENABLED:-true}
      AI_EMBEDDING_CODE: ${AI_EMBEDDING_CODE:-openai}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-1536}
      MILVUS_ENABLED: ${MILVUS_ENABLED:-false}
      MILVUS_URI: ${MILVUS_URI:-}
      MILVUS_HOST: ${MILVUS_HOST:-}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_DATABASE: ${MILVUS_DATABASE:-default}
      MILVUS_SECURE: ${MILVUS_SECURE:-true}
    # 聚合器 fail-fast：任一上下文起不来即进程退出→容器非 running→由 restart 策略拉起。
    # 健康检查探 manager（最后确认的关键面）；四个上下文都在同一进程，进程活着即四者皆活。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/manager/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 150s
    deploy:
      resources:
        limits:
          memory: 1408M
    networks: [nebula-net]
