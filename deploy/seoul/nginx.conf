# 首尔入口 Nginx —— B 节点 (43.133.71.130)
#
# 部署位置：/etc/nginx/conf.d/nebula.conf
#           配套 snippets/ 放到 /etc/nginx/snippets/
# 职责：公网入口 -> 经 WireGuard 转发到 A 国内节点。
# B 上不跑 Java / MySQL / Redis / MinIO，它们全在 A（10.8.0.2）。
#
# 关于跨境延迟：A<->B 实测 TCP 中位 225ms（ICMP 的 53ms 是假象，
# 腾讯云对 ICMP 走快速路径）。下面的 keepalive 能省掉每请求一次的
# TCP 握手，在这条链路上是最值钱的一项优化。
#
# 本文件是唯一真相源，改动走 git；1Panel 仅用于查看与应急修改。
#
# ---- ⚠️ 为什么 80 没有跳转到 443 ----
# Cloudflare 当前是 Flexible 模式（CF->源站走明文 HTTP）。
# 此时若在源站做 80->443 跳转会形成无限循环：
#   浏览器 --https--> CF --http--> 源站 --301 https--> CF --> 浏览器 --https--> ...
# 正确顺序是：先在 CF 把 SSL/TLS 模式改成 Full (strict)，
# 确认 CF 已用 HTTPS 回源后，再启用下方注释掉的跳转。

# A 节点 Gateway。keepalive 复用长连接，省掉跨境 TCP 握手。
upstream nebula_gateway {
    server 10.8.0.2:19000 max_fails=3 fail_timeout=15s;
    keepalive 32;
    keepalive_timeout 60s;
}

# A 节点 MinIO，供 s3.orccode.com 的文件直链回源。
upstream nebula_minio {
    server 10.8.0.2:9000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# 取真实客户端 IP。仅当连接确实来自 Cloudflare 边缘时才会改写，
# 因此对灰云(DNS only)的站点无副作用，可以全局声明。
# 完整 CF IP 段见 https://www.cloudflare.com/ips/，需定期更新。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# WebSocket 升级映射：Woodpecker 的实时构建日志需要。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 限流：跨境链路带宽有限，挡住异常刷量。
limit_req_zone $binary_remote_addr zone=nebula_api:10m rate=20r/s;

# 共用的回源头部。全站唯一一次跨境就发生在这里。
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# TLS 参数见 snippets/nebula-tls.conf，在每个 443 server 块内 include。
# 证书由 certbot 以 webroot 方式签发并自动续期（certbot.timer 每日检查），
# 故意不让 certbot 改写本文件。

# ================= API 入口 =================
server {
    listen 80;
    listen [::]:80;
    server_name api.orccode.com;

    client_max_body_size 12m;
    access_log /var/log/nginx/nebula-api.access.log;
    error_log  /var/log/nginx/nebula-api.error.log warn;

    # Let's Encrypt HTTP-01 验证。即使域名开了 Cloudflare 橙云代理也能通过：
    # CF 会把 /.well-known/ 的请求原样回源到这里。必须优先于其他 location，
    # 且不能被 limit_req 挡住。续期依赖它，勿删。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # CF 切到 Full (strict) 之后，把下面两行的注释去掉即可强制 HTTPS。
    # return 301 https://$host$request_uri;

    include snippets/nebula-api-locations.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.orccode.com;

    ssl_certificate     /etc/letsencrypt/live/api.orccode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.orccode.com/privkey.pem;
    include snippets/nebula-tls.conf;

    # blog/forge 的 multipart 上限是 10MB，放宽到 12MB 留表单开销余量。
    # 设小了会在 Nginx 层就 413，看不到后端的错误信息。
    client_max_body_size 12m;
    access_log /var/log/nginx/nebula-api.access.log;
    error_log  /var/log/nginx/nebula-api.error.log warn;

    include snippets/nebula-api-locations.conf;
}

# ================= 文件直链入口 =================
server {
    listen 80;
    listen [::]:80;
    server_name s3.orccode.com;

    client_max_body_size 12m;
    access_log /var/log/nginx/nebula-s3.access.log;
    error_log  /var/log/nginx/nebula-s3.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # return 301 https://$host$request_uri;   # 同上，等 CF 切 Full (strict)

    include snippets/nebula-s3-locations.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s3.orccode.com;

    # 与 api 同一张证书（certbot 一次签发覆盖两个域名）。
    ssl_certificate     /etc/letsencrypt/live/api.orccode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.orccode.com/privkey.pem;
    include snippets/nebula-tls.conf;

    client_max_body_size 12m;
    access_log /var/log/nginx/nebula-s3.access.log;
    error_log  /var/log/nginx/nebula-s3.error.log warn;

    include snippets/nebula-s3-locations.conf;
}

# ================= Woodpecker CI 入口 =================
server {
    listen 80;
    listen [::]:80;
    server_name ci.orccode.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # 证书就绪前先直接服务(HTTP)，就绪后改成 301 跳转。
    include snippets/nebula-ci.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ci.orccode.com;

    ssl_certificate     /etc/letsencrypt/live/ci.orccode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ci.orccode.com/privkey.pem;
    include snippets/nebula-tls.conf;

    access_log /var/log/nginx/nebula-ci.access.log;
    error_log  /var/log/nginx/nebula-ci.error.log warn;

    include snippets/nebula-ci.conf;
}

