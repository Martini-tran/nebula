# 首尔入口 Nginx（2c4g）—— 前端静态托管 + API 转发
#
# 部署位置：/etc/nginx/conf.d/nebula.conf，snippets/ 放到 /etc/nginx/snippets/。
#           由 deploy/seoul/setup.sh 安装，它会把下文的 orccode.com 替换成 DOMAIN。
# 职责：
#   - 托管 5 个前端，静态文件在 /var/www/nebula/<站点>/（由 deploy-frontend.sh 推送）
#   - 每个前端域名下的 /api/** 同源转发到 4c4g 的 Gateway（经 WireGuard 10.8.0.2:19000）
#     同源意味着不需要 CORS，前端代码里的 baseURL=/api 原样可用
#   - s3 域名回源 4c4g 的 MinIO，提供公开桶直链和私有桶预签名 URL
# 首尔不跑 Java / MySQL / Redis / MinIO，它们全在 4c4g。
#
# 本文件是唯一真相源，改动走 git，然后在首尔重新执行 setup.sh。

# 4c4g Gateway。首尔到 4c4g 约 100ms，keepalive 复用长连接，
# 省掉每个请求一次 TCP 握手（约一个 RTT），是这条链路上最值钱的优化。
upstream nebula_gateway {
    server 10.8.0.2:19000 max_fails=3 fail_timeout=15s;
    keepalive 32;
    keepalive_timeout 60s;
}

# 4c4g MinIO，供 s3 域名的文件直链回源。
upstream nebula_minio {
    server 10.8.0.2:9000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# 取真实客户端 IP。仅当连接确实来自 Cloudflare 边缘时才会改写，
# 不走 Cloudflare 代理（灰云 / 没用 Cloudflare）时这段不生效，也没有副作用。
# 完整 CF IP 段见 https://www.cloudflare.com/ips/。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# API 限流：跨境链路带宽有限，挡住异常刷量。
limit_req_zone $binary_remote_addr zone=nebula_api:10m rate=20r/s;

# ================= HTTP：只做证书验证和跳转 =================
# ⚠️ 如果域名开了 Cloudflare 橙云代理，SSL/TLS 模式必须是 Full (strict)。
#    Flexible 模式下 CF 用 HTTP 回源，这里的 301 会形成无限跳转。
server {
    listen 80;
    listen [::]:80;
    server_name admin.orccode.com blog.orccode.com space.orccode.com
                forge.orccode.com scribe.orccode.com s3.orccode.com;

    # Let's Encrypt HTTP-01 验证，证书续期依赖它，必须优先于跳转。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ================= 管理后台（web-ele，hash 路由）=================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.orccode.com;
    include snippets/nebula-tls.conf;

    root /var/www/nebula/admin;
    # manager 单文件上限 50MB，留出表单开销余量。设小了会在 nginx 层直接 413。
    client_max_body_size 55m;
    access_log /var/log/nginx/nebula-admin.access.log;
    error_log  /var/log/nginx/nebula-admin.error.log warn;

    include snippets/nebula-spa.conf;
    include snippets/nebula-api.conf;
}

# ================= 博客前台 =================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.orccode.com;
    include snippets/nebula-tls.conf;

    root /var/www/nebula/blog;
    # blog 的 multipart 上限 10MB。
    client_max_body_size 12m;
    access_log /var/log/nginx/nebula-blog.access.log;
    error_log  /var/log/nginx/nebula-blog.error.log warn;

    include snippets/nebula-spa.conf;
    include snippets/nebula-api.conf;
}

# ================= 个人空间 =================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name space.orccode.com;
    include snippets/nebula-tls.conf;

    root /var/www/nebula/space;
    # 文件柜单文件上限 100MB（space 的 multipart 上限 102MB）。
    client_max_body_size 105m;
    access_log /var/log/nginx/nebula-space.access.log;
    error_log  /var/log/nginx/nebula-space.error.log warn;

    include snippets/nebula-spa.conf;
    include snippets/nebula-api.conf;
}

# ================= Forge（含 /docs/ 文档站）=================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forge.orccode.com;
    include snippets/nebula-tls.conf;

    root /var/www/nebula/forge;
    # forge 的 multipart 上限 10MB。
    client_max_body_size 12m;
    access_log /var/log/nginx/nebula-forge.access.log;
    error_log  /var/log/nginx/nebula-forge.error.log warn;

    # VitePress 文档站打包在 dist/docs/，页面是 xxx.html 静态文件，
    # 不能落到 SPA 的 index.html 回退上。
    location /docs/ {
        try_files $uri $uri.html $uri/ /docs/404.html;
    }

    include snippets/nebula-spa.conf;
    include snippets/nebula-api.conf;
}

# ================= Scribe 写作台 =================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scribe.orccode.com;
    include snippets/nebula-tls.conf;

    root /var/www/nebula/scribe;
    client_max_body_size 12m;
    access_log /var/log/nginx/nebula-scribe.access.log;
    error_log  /var/log/nginx/nebula-scribe.error.log warn;

    include snippets/nebula-spa.conf;
    include snippets/nebula-api.conf;
}

# ================= 文件直链（MinIO）=================
# 后端用 MINIO_PUBLIC_DOMAIN=https://s3.orccode.com 拼返回给浏览器的文件地址。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name s3.orccode.com;
    include snippets/nebula-tls.conf;

    client_max_body_size 105m;
    access_log /var/log/nginx/nebula-s3.access.log;
    error_log  /var/log/nginx/nebula-s3.error.log warn;

    include snippets/nebula-s3-locations.conf;
}
