# 首尔入口 Nginx 配置（2c4g，只做反向代理）
#
# 部署位置：/etc/nginx/conf.d/nebula.conf
# 职责：Cloudflare 回源落点 -> 经 WireGuard 转发到北京 Gateway。
# 首尔不跑 Java、MySQL、Redis、MinIO —— 2c4g 撑不住，也没必要。
#
# 使用前替换：
#   example.com     -> 你的域名
#   10.8.0.2        -> 北京服务器的 WireGuard 内网 IP

# 北京 Gateway。keepalive 复用长连接，能省掉每请求一次的跨境 TCP 握手，
# 在 50ms 延迟的链路上这个收益很明显。
upstream nebula_gateway {
    server 10.8.0.2:19000 max_fails=3 fail_timeout=15s;
    keepalive 32;
    keepalive_timeout 60s;
}

# 北京 MinIO，用于 s3.example.com 的文件直链。
upstream nebula_minio {
    server 10.8.0.2:9000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# 取真实客户端 IP。经过 Cloudflare 后 $remote_addr 是 CF 边缘节点地址，
# 不还原的话所有访问日志和限流都会把全世界用户当成同一个来源。
# 完整 CF IP 段见 https://www.cloudflare.com/ips/，需定期更新。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# 限流：跨境链路带宽有限，挡住异常刷量。
limit_req_zone $binary_remote_addr zone=nebula_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com s3.example.com;
    # Cloudflare 到源站建议用 Full (strict)。若已签发证书，这里改成 301 跳转；
    # 若暂用 Flexible 模式（CF 到源站走 HTTP），保留 80 直接服务并删掉下面的 443 块。
    return 301 https://$host$request_uri;
}

# ---------------- API 入口 ----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # 推荐用 Cloudflare Origin CA 证书（有效期 15 年，仅 CF 可校验）
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 文件上传：blog/forge 的 multipart 上限是 10MB，
    # 这里放宽到 12MB 留出表单开销余量。设小了会在 Nginx 层就 413。
    client_max_body_size 12m;

    access_log /var/log/nginx/nebula-api.access.log;
    error_log  /var/log/nginx/nebula-api.error.log warn;

    location / {
        limit_req zone=nebula_api burst=40 nodelay;

        proxy_pass http://nebula_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # sa-token 从 Authorization 头取 token，Nginx 默认会透传，
        # 但显式声明可避免被其他 proxy_set_header 规则意外清掉。
        proxy_set_header Authorization     $http_authorization;

        # 超时：AI 流程编排（manager 的 flow/agent 执行）可能跑很久，
        # 默认 60s 会把长任务的响应掐断，这里放宽到 300s。
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # SSE / 流式响应必须关缓冲，否则前端要等全部结束才收到内容。
        proxy_buffering off;
        proxy_cache off;
    }

    # 健康检查不记日志、不限流，避免污染监控数据。
    location /actuator/health {
        proxy_pass http://nebula_gateway;
        proxy_set_header Host $host;
        access_log off;
    }
}

# ---------------- 文件直链入口 ----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s3.example.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    location / {
        proxy_pass http://nebula_minio;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 关键：Host 必须原样透传。MinIO 预签名 URL 的签名把 Host 算在内，
        # 改写 Host 会导致签名校验失败，返回 SignatureDoesNotMatch。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        # 大文件下载关闭缓冲，避免首尔磁盘被临时文件写满。
        proxy_buffering off;
    }

    # 私有桶预签名 URL 带有时效签名，被 CDN 缓存会导致过期后仍能访问，
    # 属于越权风险。这里显式声明不缓存，Cloudflare 侧也要配相同规则。
    location /nebula/ {
        proxy_pass http://nebula_minio;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Cache-Control "no-store, private" always;
    }
}
