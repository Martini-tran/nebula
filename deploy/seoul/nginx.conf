    http2 on;
    server_name blog.orccode.com;

    ssl_certificate     /etc/letsencrypt/live/blog.orccode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.orccode.com/privkey.pem;
    include snippets/nebula-tls.conf;

    access_log /var/log/nginx/nebula-blog.access.log;
    error_log  /var/log/nginx/nebula-blog.error.log warn;

    include snippets/nebula-blog.conf;
