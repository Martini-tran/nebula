# /api/** 同源转发到 4c4g Gateway —— 在前端站点的 server 块内 include。
#
# 前端 baseURL=/api，请求形如 /api/manager/auth/login；网关路由前缀是 /manager/**，
# 所以要剥掉 /api。proxy_pass 末尾的斜杠就是干这个的，删掉它会原样转发 /api/... 然后 404。
#
# ^~ 让这个前缀优先于 nebula-spa.conf 里的静态资源正则，避免 /api/xxx.js 之类被当成文件。
location ^~ /api/ {
    limit_req zone=nebula_api burst=40 nodelay;

    proxy_pass http://nebula_gateway/;

    # 这两行是 upstream keepalive 生效的前提，缺了就退化成每请求新建连接。
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # location 里只要写了一条 proxy_set_header，外层的就全部不再继承，
    # 所以需要的头都在这里写全。Authorization（sa-token）默认透传，无需声明。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # AI 流程编排的长任务可能跑几分钟，默认 60s 会把响应掐断。
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # SSE / 流式响应必须关缓冲，否则前端要等全部结束才收到内容。
    proxy_buffering off;
}
