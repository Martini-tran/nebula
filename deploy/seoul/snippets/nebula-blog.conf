# blog.orccode.com 的共用 location 块（80 / 443 复用）
#
# blog-ui 是 SPA：History 模式 + base=/，所有路由 fallback 到 index.html。
# 静态文件已部署到 /var/www/blog。

location / {
    root /var/www/blog;
    try_files $uri $uri/ /index.html;

    # SPA 资源都带 hash，可以长缓存。index.html 不能缓存（路由变了要拿新的）。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# API 代理到 A 节点网关（blog-ui 的请求走 /blog/front/**）
location /blog/ {
    proxy_pass http://nebula_gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;

    # SSE 流式响应（如果 blog 有 AI 对话功能）
    proxy_buffering off;
    proxy_cache off;
}

# 健康检查不记日志
location = /actuator/health {
    proxy_pass http://nebula_gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    access_log off;
}
