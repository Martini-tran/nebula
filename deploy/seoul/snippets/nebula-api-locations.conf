# api.orccode.com 的转发规则 —— 被 80 与 443 两个 server 块共用。
# 抽成 include 是为了避免两份配置漂移：改一处即可同时生效。

# ---------- 管理端前端 (web-ele) ----------
# 构建产物放在 /var/www/admin/，对应 VITE_BASE=/admin/。
# 用 root 而非 alias：alias 配 try_files 时路径拼接规则很反直觉，容易踩坑。
location /admin/ {
    root /var/www;
    # SPA 回退。虽然用的是 hash 路由(VITE_ROUTER_HISTORY=hash)刷新不会 404，
    # 但留着这条可以兼容将来切 history 模式。
    try_files $uri $uri/ /admin/index.html;

    # 带 hash 的静态资源可以长期缓存；index.html 必须不缓存，
    # 否则发新版后用户拿到旧的 index 指向已删除的 chunk，白屏。
    location ~* \.(js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
        root /var/www;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location = /admin/index.html {
        root /var/www;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

# 裸访问 /admin 补上斜杠，否则相对路径会全错
location = /admin {
    return 301 /admin/;
}

# ---------- 前端的 API 前缀 ----------
# 前端 VITE_GLOB_API_URL=/api，请求形如 /api/manager/admin/xxx；
# 而网关的路由前缀是 /manager/**，所以这里要剥掉 /api。
# proxy_pass 末尾的斜杠就是干这个的，删掉它会变成 /api/manager/... 转发过去然后 404。
location /api/ {
    limit_req zone=nebula_api burst=40 nodelay;

    proxy_pass http://nebula_gateway/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;

    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_buffering off;
    proxy_cache off;
}

# ---------- 直接访问网关路由 ----------
# 保留原有行为：/manager/** /blog/** 等可以不经 /api 前缀直接调，
# 方便用 curl 调试和给外部集成用。
location / {
    limit_req zone=nebula_api burst=40 nodelay;

    proxy_pass http://nebula_gateway;
    # 这两行是 upstream keepalive 生效的前提，缺了就退化成每请求新建连接。
    # 在 225ms 的跨境链路上，省掉一次 TCP 握手是最值钱的优化。
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # sa-token 从 Authorization 头取 token。Nginx 默认会透传，
    # 显式声明可避免被其他 proxy_set_header 规则意外清掉。
    proxy_set_header Authorization $http_authorization;

    # AI 流程编排(manager 的 flow/agent 执行)可能跑很久，
    # 默认 60s 会把长任务的响应掐断。
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # SSE / 流式响应必须关缓冲，否则前端要等全部结束才收到内容。
    proxy_buffering off;
    proxy_cache off;
}

# 健康检查不记日志、不限流，避免污染监控数据。
location = /actuator/health {
    proxy_pass http://nebula_gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    access_log off;
}
