# 前端静态文件 + SPA 路由回退 —— 在前端站点的 server 块内 include，root 由 server 块指定。

# Ubuntu 的 nginx.conf 默认 gzip on，但只压 text/html；在 server 级补上类型，
# 不写在 http 级是为了避免和发行版 nginx.conf 撞 "directive is duplicate"。
gzip_vary  on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# history 路由刷新时路径不存在，回退到 index.html 交给前端路由。
location / {
    try_files $uri $uri/ /index.html;
}

# 构建产物带 hash，可以长缓存。
location ~* \.(?:js|mjs|css|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# index.html 不能缓存：发新版后用户拿到旧 index，会去请求已被删掉的 chunk，白屏。
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
}
