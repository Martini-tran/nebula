# s3.orccode.com 的转发规则 —— 被 80 与 443 两个 server 块共用。

location / {
    proxy_pass http://nebula_minio;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 关键：Host 必须原样透传。MinIO 预签名 URL 的签名把 Host 算在内，
    # 改写 Host 会导致签名校验失败，返回 SignatureDoesNotMatch。
    proxy_set_header Host $host;

    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    # 大文件下载关闭缓冲，避免 B 的磁盘被临时文件写满。
    proxy_buffering off;
}

# 私有桶(nebula)走预签名 URL，带时效签名。被 CDN 缓存会导致过期后
# 仍能访问，属于越权风险。Cloudflare 侧也要配相同的不缓存规则。
location /nebula/ {
    proxy_pass http://nebula_minio;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    add_header Cache-Control "no-store, private" always;
}
