# TLS 证书与参数 —— 放在每个 443 server 块内 include。
#
# 证书：setup.sh 用 certbot 以 webroot 方式签发一张多域名证书（--cert-name nebula），
# 覆盖全部子域名；certbot.timer 每日检查续期，续期后由 deploy hook reload nginx。
# 故意不用 certbot --nginx，不让它改写 git 管理的配置。
ssl_certificate     /etc/letsencrypt/live/nebula/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/nebula/privkey.pem;

# 不能放在 conf.d 的 http 上下文：Ubuntu 的 /etc/nginx/nginx.conf 已经声明过
# ssl_protocols 与 ssl_prefer_server_ciphers，再声明一次会报
# "directive is duplicate" 导致 nginx 拒绝启动。
# 写在 server 级则是合法覆盖，还能顺便去掉系统默认里过时的 TLSv1/TLSv1.1。
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
