server:
  port: 8083
  servlet:
    context-path: /space

spring:
  servlet:
    multipart:
      # 文件柜单个文件上限见 nebula.file.max-file-size，这里略大一点，让超限时报的是那边的中文提示
      max-file-size: 101MB
      max-request-size: 102MB
  application:
    name: nebula-service-space
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:nebula}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:nebula}
    password: ${MYSQL_PASSWORD:$8mKpL9#qR2&xVwN4@yT}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:N3bula_Redis@2026#K8xP}
      database: 0
      timeout: 5s

nebula:
  redis:
    namespace: nebula
  minio:
    enabled: true
    endpoint: ${MINIO_ENDPOINT:127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:nebulaadmin}
    secret-key: ${MINIO_SECRET_KEY:N3bula_MinIO@2026#K7qL9xP4vT}
    # 私有桶（默认）：文件柜的文件只经服务端转发下载，不给直链
    default-bucket: ${MINIO_PRIVATE_BUCKET:nebula}
    use-ssl: false
    buckets:
      nebula:
        bucket-name: ${MINIO_PRIVATE_BUCKET:nebula}
        auto-create: true
  # 公共文件组件（sys_file）：文件柜的文件存在私有桶的 space/{userId}/ 下
  file:
    enabled: true
    default-bucket: ${MINIO_PRIVATE_BUCKET:nebula}
    max-file-size: 104857600
  space:
    files:
      # 每人容量，最近删除里的也算
      quota: ${SPACE_FILE_QUOTA:10GB}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

logging:
  level:
    root: INFO
    com.nebula: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
