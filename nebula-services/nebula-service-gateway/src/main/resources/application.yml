server:
  port: 19000

spring:
  application:
    name: nebula-service-gateway
  # 路由定义独立维护，避免 application.yml 过长
  config:
    import: gateway-routes.yml
  data:
    # 与 nebula-service-auth 同一 Redis 实例，sa-token 通过 sa-token-redis-jackson 共享 token/session
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:N3bula_Redis@2026#K8xP}
      database: 0
      timeout: 5s

# 与 auth 完全一致，否则 token 命名/有效期等行为不一致
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

nebula:
  # 与 auth 保持一致：统一 Redis key 前缀，避免多服务/环境串扰
  redis:
    namespace: nebula
  gateway:
    auth:
      # 鉴权白名单（Ant 风格），命中直接放行，不做登录校验
      whitelist:
        - /manager/auth/login
        - /manager/auth/register
        - /manager/auth/logout
        - /manager/captcha/**
        - /blog/front/**
        - /forge/front/**
        - /actuator/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
