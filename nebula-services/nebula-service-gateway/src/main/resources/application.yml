server:
  port: 9000

spring:
  application:
    name: nebula-service-gateway
  data:
    # 与 nebula-service-auth 同一 Redis 实例，sa-token 通过 sa-token-redis-jackson 共享 token/session
    redis:
      host: 140.143.222.164
      port: 6380
      password: "hump!#123"
      database: 0
      timeout: 5s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: nebula-service-auth
              uri: http://localhost:9001
              predicates:
                - Path=/auth/**
            - id: nebula-service-system
              uri: http://localhost:9002
              predicates:
                - Path=/system/**

# 与 auth 完全一致，否则 token 命名/有效期等行为不一致
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

nebula:
  # 与 auth 保持一致：统一 Redis key 前缀，避免多服务/环境串扰
  redis:
    namespace: nebula
  gateway:
    auth:
      # 鉴权白名单（Ant 风格），命中直接放行，不做登录校验
      whitelist:
        - /auth/login
        - /auth/register
        - /auth/logout
        - /auth/captcha/**
        - /actuator/**

management:
  endpoints:
    web:
      exposure:
        include: health,info